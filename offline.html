<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Offline — Eggland BD</title>
  <link rel="icon" href="/egglandbd/assets/images/logo.png">
  <style>
    body { margin:0; font-family:Inter,sans-serif; background:#F7F8FA; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:white; border-radius:20px; padding:48px; text-align:center; max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,0.12); border:1px solid #E5E7EB; }
    h1 { font-size:24px; font-weight:800; color:#1A1A1A; margin:16px 0 8px; }
    p { color:#6B7280; font-size:14px; line-height:1.6; }
    .btn { display:inline-block; margin-top:24px; padding:12px 28px; background:#8B002D; color:white; border-radius:10px; text-decoration:none; font-weight:700; font-size:14px; }
    .icon { font-size:64px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Eggland BD requires an internet connection. Please check your network and try again.</p>
    <a href="/egglandbd/" class="btn" onclick="location.reload()">Try Again</a>
  </div>

</html>
